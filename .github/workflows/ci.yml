name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # Senha pública dos usuários de demonstração da loja (aparece na página de login).
  SENHA_DA_LOJA: secret_sauce

jobs:
  cenarios:
    name: Cenários
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest

  sem-o-proton:
    # Liberdade do código: sem o ponto de entrada do Proton e sem a SDK, todos os
    # cenários continuam rodando.
    name: Sem o Proton
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: rm tests/test_proton_script.py
      - run: uv remove protoncloud-sdk
      - name: Nada em automacao/ importa o Proton
        run: |
          if grep -rnE '^\s*(import|from) proton' automacao/; then exit 1; fi
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest
